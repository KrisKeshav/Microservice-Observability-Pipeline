[SERVICE]
    Flush         1
    Log_Level     info
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On

[INPUT]
    Name          kafka
    Brokers       kafka:9092
    Topics        app-logs
    Group_Id      fluent-bit-loki-consumer
    Format        json

[FILTER]
    # The Kafka input wraps each message as {topic, partition, offset, error, key, payload}.
    # Drop the Kafka metadata first: after lifting, "error" would also delete the app's own error field.
    Name          record_modifier
    Match         *
    Remove_key    topic
    Remove_key    partition
    Remove_key    offset
    Remove_key    error
    Remove_key    key

[FILTER]
    Name          nest
    Match         *
    Operation     lift
    Nested_under  payload

[OUTPUT]
    Name          loki
    Match         *
    Host          loki
    Port          3100
    # Low-cardinality labels only; request_id stays in the log line and is filtered with |=.
    Labels        job=fluent-bit
    Label_Keys    $name,$levelname
    Line_Format   json
