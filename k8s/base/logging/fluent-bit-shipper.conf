[SERVICE]
    Flush         1
    Log_Level     info
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On

[INPUT]
    Name              tail
    Tag               kube.*
    # Each environment's shipper only reads logs from pods in its own namespace.
    Path              /var/log/containers/*_${POD_NAMESPACE}_*.log
    Exclude_Path      /var/log/containers/fluent-bit-*.log
    # Container runtimes write either Docker JSON or CRI format; handle both.
    multiline.parser  docker, cri
    # Remembers file offsets, so a restarted shipper resumes instead of losing lines.
    DB                /var/log/flb_${POD_NAMESPACE}.db
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

[FILTER]
    Name                kubernetes
    Match               kube.*
    Kube_Tag_Prefix     kube.var.log.containers.
    # Lift the JSON fields from the app (levelname, event, request_id...) to the top level.
    Merge_Log           On
    Keep_Log            Off
    Labels              Off
    Annotations         Off

[OUTPUT]
    Name        kafka
    Match       kube.*
    Brokers     kafka:9092
    Topics      app-logs
    Format      json
    rdkafka.queue.buffering.max.messages 200000
