apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit-shipper
---
# Namespaced Role (not a ClusterRole): the shipper only enriches pods in its own namespace,
# so dev and prod never share or overwrite each other's permissions.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fluent-bit-shipper
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fluent-bit-shipper
subjects:
  - kind: ServiceAccount
    name: fluent-bit-shipper
roleRef:
  kind: Role
  name: fluent-bit-shipper
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit-shipper
  labels:
    app: fluent-bit-shipper
spec:
  selector:
    matchLabels:
      app: fluent-bit-shipper
  template:
    metadata:
      labels:
        app: fluent-bit-shipper
    spec:
      serviceAccountName: fluent-bit-shipper
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.0.0
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: 2020
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          securityContext:
            # Runs as root only because node log files are root-owned; no extra capabilities.
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: fluent-bit-shipper-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
---
apiVersion: v1
kind: Service
metadata:
  name: fluent-bit-shipper
spec:
  type: ClusterIP
  selector:
    app: fluent-bit-shipper
  ports:
    - name: metrics
      port: 2020
      targetPort: 2020
