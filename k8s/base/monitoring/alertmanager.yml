global:
  resolve_timeout: 5m

# Route on severity, not alert name: any new critical alert pages without a config change.
route:
  receiver: slack-warning
  group_by: ["alertname", "job"]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      receiver: slack-critical

# While a critical alert fires for a service, mute that service's warnings (one page, not five).
inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: ["job"]

receivers:
  - name: slack-critical
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '[CRITICAL] {{ .CommonLabels.alertname }} ({{ .CommonLabels.job }})'
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
  - name: slack-warning
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack_webhook_url
        send_resolved: true
        title: '[WARNING] {{ .CommonLabels.alertname }} ({{ .CommonLabels.job }})'
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
