apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
data:
  alerts.yml: |
    groups:
      - name: observability-alerts
        rules:
          - alert: HighErrorRate
            expr: (sum by(service) (rate(http_requests_total{status=~"5.."}[1m])) / sum by(service) (rate(http_requests_total[1m]))) > 0.05
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "High HTTP error rate on {{ $labels.service }}"
              description: "5xx error rate on {{ $labels.service }} is {{ $value | humanizePercentage }} (above 5% threshold)."

          - alert: DbPoolExhaustion
            expr: db_pool_active >= db_pool_max and db_pool_max > 0
            for: 10s
            labels:
              severity: critical
              service: service-c
            annotations:
              summary: "Service C database connection pool exhausted"
              description: "PostgreSQL pool in Service C is fully saturated ({{ $value }} active connections)."

          - alert: KafkaConsumerLagHigh
            expr: kafka_consumergroup_lag > 50
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "High Kafka consumer lag for group {{ $labels.consumergroup }}"
              description: "Consumer group {{ $labels.consumergroup }} on topic {{ $labels.topic }} is lagging with {{ $value }} unconsumed messages."

          - alert: TelemetryServiceDown
            expr: up{job=~"loki|jaeger|fluent-bit-shipper|fluent-bit-consumer|kafka-exporter"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Telemetry component {{ $labels.job }} is unreachable"
              description: "Prometheus failed to scrape {{ $labels.job }} endpoint (target is down)."
