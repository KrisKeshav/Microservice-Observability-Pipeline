# SLOs for Service A (the user-facing gateway). See docs/SLO.md.
#   availability: 99% of requests are not 5xx      -> error budget 1%
#   latency:      95% of order reads finish <300ms -> error budget 5%
groups:
  - name: service-a-slo-recordings
    rules:
      - record: slo:service_a:availability_error_ratio:rate5m
        expr: |
          (sum(rate(http_requests_total{job="service-a",status=~"5.."}[5m])) or vector(0))
            /
            sum(rate(http_requests_total{job="service-a"}[5m]))
      - record: slo:service_a:availability_error_ratio:rate30m
        expr: |
          (sum(rate(http_requests_total{job="service-a",status=~"5.."}[30m])) or vector(0))
            /
            sum(rate(http_requests_total{job="service-a"}[30m]))
      - record: slo:service_a:availability_error_ratio:rate1h
        expr: |
          (sum(rate(http_requests_total{job="service-a",status=~"5.."}[1h])) or vector(0))
            /
            sum(rate(http_requests_total{job="service-a"}[1h]))
      - record: slo:service_a:availability_error_ratio:rate6h
        expr: |
          (sum(rate(http_requests_total{job="service-a",status=~"5.."}[6h])) or vector(0))
            /
            sum(rate(http_requests_total{job="service-a"}[6h]))
      - record: slo:service_a:availability_error_ratio:rate30d
        expr: |
          (sum(rate(http_requests_total{job="service-a",status=~"5.."}[30d])) or vector(0))
            /
            sum(rate(http_requests_total{job="service-a"}[30d]))
      - record: slo:service_a:latency_bad_ratio:rate5m
        expr: |
          1 - (
              sum(rate(http_request_duration_seconds_bucket{job="service-a",handler="/api/orders/{order_id}",le="0.3"}[5m]))
              /
              sum(rate(http_request_duration_seconds_count{job="service-a",handler="/api/orders/{order_id}"}[5m]))
            )
      - record: slo:service_a:latency_bad_ratio:rate30m
        expr: |
          1 - (
              sum(rate(http_request_duration_seconds_bucket{job="service-a",handler="/api/orders/{order_id}",le="0.3"}[30m]))
              /
              sum(rate(http_request_duration_seconds_count{job="service-a",handler="/api/orders/{order_id}"}[30m]))
            )
      - record: slo:service_a:latency_bad_ratio:rate1h
        expr: |
          1 - (
              sum(rate(http_request_duration_seconds_bucket{job="service-a",handler="/api/orders/{order_id}",le="0.3"}[1h]))
              /
              sum(rate(http_request_duration_seconds_count{job="service-a",handler="/api/orders/{order_id}"}[1h]))
            )
      - record: slo:service_a:latency_bad_ratio:rate6h
        expr: |
          1 - (
              sum(rate(http_request_duration_seconds_bucket{job="service-a",handler="/api/orders/{order_id}",le="0.3"}[6h]))
              /
              sum(rate(http_request_duration_seconds_count{job="service-a",handler="/api/orders/{order_id}"}[6h]))
            )
      - record: slo:service_a:latency_bad_ratio:rate30d
        expr: |
          1 - (
              sum(rate(http_request_duration_seconds_bucket{job="service-a",handler="/api/orders/{order_id}",le="0.3"}[30d]))
              /
              sum(rate(http_request_duration_seconds_count{job="service-a",handler="/api/orders/{order_id}"}[30d]))
            )
      - record: slo:service_a:availability_burn_rate:5m
        expr: slo:service_a:availability_error_ratio:rate5m / 0.01
      - record: slo:service_a:latency_burn_rate:5m
        expr: slo:service_a:latency_bad_ratio:rate5m / 0.05
      - record: slo:service_a:availability_burn_rate:30m
        expr: slo:service_a:availability_error_ratio:rate30m / 0.01
      - record: slo:service_a:latency_burn_rate:30m
        expr: slo:service_a:latency_bad_ratio:rate30m / 0.05
      - record: slo:service_a:availability_burn_rate:1h
        expr: slo:service_a:availability_error_ratio:rate1h / 0.01
      - record: slo:service_a:latency_burn_rate:1h
        expr: slo:service_a:latency_bad_ratio:rate1h / 0.05
      - record: slo:service_a:availability_burn_rate:6h
        expr: slo:service_a:availability_error_ratio:rate6h / 0.01
      - record: slo:service_a:latency_burn_rate:6h
        expr: slo:service_a:latency_bad_ratio:rate6h / 0.05
      - record: slo:service_a:error_budget_remaining:30d
        expr: 1 - slo:service_a:availability_error_ratio:rate30d / 0.01

  # Multi-window, multi-burn-rate alerts (Google SRE workbook).
  # The long window proves the problem is real; the short window proves it is still happening.
  - name: service-a-slo-alerts
    rules:
      - alert: SLOFastBurn
        expr: |
          (slo:service_a:availability_burn_rate:1h > 14.4 and slo:service_a:availability_burn_rate:5m > 14.4)
          or
          (slo:service_a:latency_burn_rate:1h > 14.4 and slo:service_a:latency_burn_rate:5m > 14.4)
        for: 2m
        labels:
          severity: critical
          job: service-a
        annotations:
          summary: "Service A is burning its error budget fast"
          description: "At this rate the 30-day error budget is gone in about 2 days."
      - alert: SLOSlowBurn
        expr: |
          (slo:service_a:availability_burn_rate:6h > 6 and slo:service_a:availability_burn_rate:30m > 6)
          or
          (slo:service_a:latency_burn_rate:6h > 6 and slo:service_a:latency_burn_rate:30m > 6)
        for: 15m
        labels:
          severity: warning
          job: service-a
        annotations:
          summary: "Service A is burning its error budget steadily"
          description: "At this rate the 30-day error budget is gone in about 5 days."
