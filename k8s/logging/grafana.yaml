apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: default
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        jsonData:
          maxLines: 1000
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_id":\s*"([a-f0-9]+)"'
              url: "http://localhost:31686/trace/$${__value.raw}"
              datasourceUid: "jaeger"
              urlDisplayLabel: "View Trace in Jaeger"
      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
      - name: PostgreSQL
        uid: postgres
        type: postgres
        access: proxy
        url: postgres:5432
        user: orders
        secureJsonData:
          password: orders
        jsonData:
          database: orders
          sslmode: disable
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: default
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
