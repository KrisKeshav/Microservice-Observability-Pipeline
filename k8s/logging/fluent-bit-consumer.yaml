apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-consumer-config
  namespace: default
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info

    [INPUT]
        Name          kafka
        Brokers       kafka:9092
        Topics        app-logs
        Group_Id      fluent-bit-loki-consumer
        Format        json

    [OUTPUT]
        Name          loki
        Match         *
        Host          loki
        Port          3100
        Labels        job=fluent-bit
        Label_Keys    $name,$levelname,$service,$request_id
        Line_Format   json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fluent-bit-consumer
  namespace: default
  labels:
    app: fluent-bit-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fluent-bit-consumer
  template:
    metadata:
      labels:
        app: fluent-bit-consumer
    spec:
      containers:
        - name: fluent-bit-consumer
          image: fluent/fluent-bit:latest
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/
      volumes:
        - name: config
          configMap:
            name: fluent-bit-consumer-config
