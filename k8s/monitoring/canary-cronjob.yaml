apiVersion: batch/v1
kind: CronJob
metadata:
  name: synthetic-canary
  namespace: default
  labels:
    app: synthetic-canary
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: synthetic-canary
        spec:
          restartPolicy: OnFailure
          containers:
            - name: canary
              image: curlimages/curl:latest
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -c
                - |
                  CANARY_ID="canary-$(date +%s)"
                  echo "Emitting synthetic canary with ID: $CANARY_ID"
                  curl -s -f -X POST http://service-a:8000/api/orders \
                    -H "Content-Type: application/json" \
                    -H "X-Request-ID: $CANARY_ID" \
                    -H "X-Demo-Scenario: canary" \
                    -d '{"order_id": "canary-transaction"}'
              resources:
                requests:
                  cpu: 20m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
