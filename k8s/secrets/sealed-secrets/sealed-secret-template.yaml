apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: app-secrets
  namespace: default
  annotations:
    sealedsecrets.bitnami.com/cluster-wide: "true"
spec:
  encryptedData:
    DATABASE_URL: AgA...encrypted_string...
    GRAFANA_ADMIN_USER: AgA...encrypted_string...
    GRAFANA_ADMIN_PASSWORD: AgA...encrypted_string...
    SLACK_WEBHOOK_URL: AgA...encrypted_string...
  template:
    metadata:
      name: app-secrets
      namespace: default
    type: Opaque
