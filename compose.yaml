# Fast local loop for the request path only (A -> B -> C -> Postgres, traces in Jaeger).
# The full pipeline (Kafka, Fluent Bit, Loki, Prometheus, anomaly detector) runs on Kubernetes.
# Local-only credentials; real environments get generated secrets from scripts/bootstrap.ps1.
x-healthcheck: &healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
  interval: 5s
  timeout: 3s
  retries: 10

services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./k8s/base/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 3s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.5.0
    ports:
      - "16686:16686"

  service-c:
    build: {context: ., args: {SERVICE: service_c}}
    environment:
      DATABASE_URL: postgresql://orders:orders@postgres:5432/orders
      FAULT_INJECTION_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck: *healthcheck

  service-b:
    build: {context: ., args: {SERVICE: service_b}}
    environment:
      SERVICE_C_URL: http://service-c:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      service-c: {condition: service_healthy}
    healthcheck: *healthcheck

  service-a:
    build: {context: ., args: {SERVICE: service_a}}
    environment:
      SERVICE_B_URL: http://service-b:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      service-b: {condition: service_healthy}
    ports:
      - "8000:8000"
    healthcheck: *healthcheck

volumes:
  pgdata:
