services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  service-c:
    build:
      context: .
      dockerfile: services/service_c/Dockerfile
    environment:
      DATABASE_URL: postgresql://orders:orders@postgres:5432/orders
      DB_POOL_SIZE: "3"
      DB_POOL_ACQUIRE_TIMEOUT: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  service-b:
    build:
      context: .
      dockerfile: services/service_b/Dockerfile
    environment:
      SERVICE_C_URL: http://service-c:8000
      SERVICE_C_TIMEOUT_SECONDS: "5"
    depends_on:
      service-c:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  service-a:
    build:
      context: .
      dockerfile: services/service_a/Dockerfile
    environment:
      SERVICE_B_URL: http://service-b:8000
      SERVICE_B_TIMEOUT_SECONDS: "5"
    depends_on:
      service-b:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
