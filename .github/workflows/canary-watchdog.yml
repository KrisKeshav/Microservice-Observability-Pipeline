# Canary Watchdog — Out-of-Band Telemetry Verification
#
# STATUS: DISABLED / STUB
#
# This workflow is intentionally non-functional in the current local setup
# (Minikube / Docker Desktop). GitHub Actions runners cannot reach a local
# cluster's Loki or Jaeger endpoints. To use this workflow you need a
# publicly reachable Kubernetes cluster (e.g. EKS, GKE, AKS) with Loki
# and Jaeger exposed via Ingress or LoadBalancer.
#
# For local development, the canary watchdog runs as a Windows Scheduled
# Task instead. See README.md for setup instructions.

name: Canary Watchdog (Disabled — requires public cluster)

on:
  # Uncomment and configure when deploying to a cloud cluster:
  # schedule:
  #   - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      note:
        description: 'Requires a publicly reachable K8s cluster — will fail against local Minikube/Docker Desktop'
        required: false
        default: 'stub only'

jobs:
  watchdog:
    # This job will fail unless LOKI_URL and JAEGER_URL point to reachable endpoints
    if: false  # Explicitly disabled — remove this line when targeting a cloud cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Run canary watchdog
        env:
          LOKI_URL: ${{ secrets.LOKI_URL }}
          JAEGER_URL: ${{ secrets.JAEGER_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LOOKBACK_MINUTES: '5'
        run: python scripts/canary_watchdog.py
