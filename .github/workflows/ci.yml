name: CI/CD

# Pull requests: validate + build + scan.  Push to main: also publish images and deploy to dev.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the jobs that need more ask for it explicitly.
permissions:
  contents: read

jobs:
  validate:
    name: Lint, test & validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pip-audit

      - name: Lint Python
        run: ruff check .

      - name: Unit tests
        env:
          OTEL_SDK_DISABLED: "true"
        run: pytest -v

      - name: Audit Python dependencies for known CVEs
        run: pip-audit -r requirements.txt

      - name: Lint YAML
        run: yamllint k8s/ .github/

      - name: Render Kustomize overlays
        run: |
          kubectl kustomize k8s/overlays/dev > /tmp/dev.yaml
          kubectl kustomize k8s/overlays/prod > /tmp/prod.yaml

      - name: Check and unit-test Prometheus rules
        run: |
          docker run --rm -v "$PWD/k8s/base/monitoring:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 \
            check rules alert-rules.yml slo-rules.yml
          docker run --rm -v "$PWD/k8s/base/monitoring:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 \
            check config --syntax-only prometheus.yml
          docker run --rm -v "$PWD/k8s/base/monitoring:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 \
            test rules rules-test.yml

      - name: Check Alertmanager config
        run: |
          docker run --rm -v "$PWD/k8s/base/monitoring:/w" -w /w --entrypoint amtool prom/alertmanager:v0.28.1 \
            check-config alertmanager.yml

      - name: Kubernetes hardening report (kube-score, informational)
        # Report-only: third-party images (Postgres, Fluent Bit) need root, which kube-score flags.
        continue-on-error: true
        run: |
          docker run --rm -v /tmp/dev.yaml:/dev.yaml:ro zegl/kube-score:v1.18.0 score /dev.yaml --output-format ci

  image:
    name: Build, scan & publish ${{ matrix.service }}
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: service-a
            module: service_a
          - service: service-b
            module: service_b
          - service: service-c
            module: service_c
          - service: anomaly-detector
            module: anomaly_detector
    env:
      # Immutable tag = commit SHA, so every deployed image traces back to exact source.
      IMAGE: ghcr.io/kriskeshav/microservice-observability-pipeline/${{ matrix.service }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once and load locally; the exact image that is scanned is the one we push.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: SERVICE=${{ matrix.module }}
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE"

  deploy-dev:
    name: Deploy to dev (GitOps)
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # CI never touches the cluster. It records the new tag in Git and Argo CD syncs it.
      - name: Point the dev overlay at this commit's images
        run: |
          sed -i "s/newTag: .*/newTag: ${GITHUB_SHA}/" k8s/overlays/dev/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(dev): ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
